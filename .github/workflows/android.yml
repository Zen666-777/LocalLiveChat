name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q LocalLiveChat-MVP-0.3.0.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: LocalLiveChat/**/*.gradle*

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build APK
        working-directory: LocalLiveChat
        run: |
          chmod +x gradlew
          sed -i 's/2026.08.00/2025.05.01/' app/build.gradle.kts
          sed -i 's/androidx.activity:activity-compose:1.12.4/androidx.activity:activity-compose:1.10.1/' app/build.gradle.kts
          sed -i 's/androidx.lifecycle:lifecycle-runtime-ktx:2.11.0/androidx.lifecycle:lifecycle-runtime-ktx:2.9.2/' app/build.gradle.kts
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MEL-Studio-APK
          path: LocalLiveChat/app/build/outputs/apk/debug/app-debug.apk
