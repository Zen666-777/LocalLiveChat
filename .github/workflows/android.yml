name: MEL Chat APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/mel-chat-mvp']
    paths: ['app/**', 'config/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'config/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore personal APK signing key
        if: github.event_name != 'pull_request'
        env:
          MEL_DEBUG_KEYSTORE_BASE64: ${{ secrets.MEL_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MEL_DEBUG_KEYSTORE_BASE64" ]; then
            echo '::error::MEL_DEBUG_KEYSTORE_BASE64 is required for personal APK updates.'
            exit 1
          fi
          umask 077
          mkdir -p ~/.android
          printf '%s' "$MEL_DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Test, lint and build installable APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Verify fixed APK signing certificate
        if: github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/mel-certificate.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/mel-certificate.txt" | tr '[:upper:]' '[:lower:]')
          expected=$(tr -d '[:space:]' < config/signing-certificate.sha256)
          if [ "$actual" != "$expected" ]; then
            echo '::error::APK signing certificate changed. Refusing to publish an incompatible update.'
            exit 1
          fi
          echo "Verified fixed signing certificate SHA-256: $actual"

      - name: Name APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MEL-Chat.apk
          cd dist
          sha256sum MEL-Chat.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'MEL-Chat-PR-TEST-APK' || 'MEL-Chat-APK' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MEL-Chat-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
