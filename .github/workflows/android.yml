name: MEL Chat APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/mel-chat-mvp']
    paths: ['app/**', 'config/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'config/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile the actual local inference engine
        run: |
          cmake -S app/src/main/cpp -B /tmp/mel-native -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/mel-native --target mel-smoke -j 2
      - name: Verify and run the recommended GGUF with no API key
        run: |
          curl --fail --location --retry 3 --output /tmp/mel-model.gguf 'https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/18727206c51467496bfba014368bd0a30e97f411/Qwen3-4B-Instruct-2507-Q4_K_M.gguf'
          echo '3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597  /tmp/mel-model.gguf' | sha256sum --check
          /tmp/mel-native/mel-smoke /tmp/mel-model.gguf

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore personal APK signing key
        if: github.event_name != 'pull_request'
        env:
          MEL_DEBUG_KEYSTORE_BASE64: ${{ secrets.MEL_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MEL_DEBUG_KEYSTORE_BASE64" ]; then
            echo '::error::MEL_DEBUG_KEYSTORE_BASE64 is required for personal APK updates.'
            exit 1
          fi
          umask 077
          key_store_path="$RUNNER_TEMP/mel-chat-debug.keystore"
          printf '%s' "$MEL_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$key_store_path"
          restored=$(keytool -exportcert -keystore "$key_store_path" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          expected=$(tr -d '[:space:]' < config/signing-certificate.sha256)
          if [ "$restored" != "$expected" ]; then
            echo '::error::Stored signing key does not match the expected certificate.'
            exit 1
          fi
          echo "MEL_SIGNING_KEYSTORE_FILE=$key_store_path" >> "$GITHUB_ENV"
          echo "Restored fixed signing certificate SHA-256: $restored"

      - name: Test, lint and build installable APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Verify fixed APK signing certificate
        if: github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/mel-certificate.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/mel-certificate.txt" | tr '[:upper:]' '[:lower:]')
          expected=$(tr -d '[:space:]' < config/signing-certificate.sha256)
          echo "APK signing certificate SHA-256: $actual"
          if [ "$actual" != "$expected" ]; then
            echo '::error::APK signing certificate changed. Refusing to publish an incompatible update.'
            exit 1
          fi
          echo "Verified fixed signing certificate SHA-256: $actual"

      - name: Name APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MEL-Chat.apk
          cd dist
          sha256sum MEL-Chat.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'MEL-Chat-PR-TEST-APK' || 'MEL-Chat-APK' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MEL-Chat-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
